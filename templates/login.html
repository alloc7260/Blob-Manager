<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Cloud Drive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <link rel="icon" type="image/png" href="cloud-storage.png" />
  </head>
  <body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full mx-4">
      <!-- Login Card -->
      <div class="bg-white rounded-2xl shadow-xl p-8">
        <div class="text-center mb-8">
          <div class="flex justify-center mb-4">
            <svg class="w-16 h-16 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
            </svg>
          </div>
          <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome Back</h1>
          <p class="text-gray-600">Sign in to access your cloud storage</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" class="space-y-6">
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700 mb-2">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              required
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
              placeholder="Enter your username"
            />
          </div>

          <div>
            <label for="totpCode" class="block text-sm font-medium text-gray-700 mb-2">TOTP Code</label>
            <input
              type="text"
              id="totpCode"
              name="totpCode"
              required
              maxlength="6"
              pattern="[0-9]{6}"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent transition font-mono text-center text-2xl tracking-widest"
              placeholder="000000"
            />
            <p class="mt-2 text-xs text-gray-500">Enter the 6-digit code from your authenticator app</p>
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition duration-200 shadow-lg hover:shadow-xl"
          >
            Sign In
          </button>
        </form>

        <!-- Signup Link -->
        <div class="mt-6 text-center">
          <p class="text-gray-600">
            Don't have an account?
            <a href="/signup" class="text-blue-600 hover:text-blue-700 font-semibold">Sign up</a>
          </p>
        </div>
      </div>

      <!-- Alert Message -->
      <div id="alert" class="mt-4 hidden rounded-lg p-4"></div>
    </div>

    <script>
      const loginForm = document.getElementById("loginForm");
      const alertBox = document.getElementById("alert");
      const totpInput = document.getElementById("totpCode");

      // Auto-format TOTP input
      totpInput.addEventListener("input", (e) => {
        e.target.value = e.target.value.replace(/[^0-9]/g, "").slice(0, 6);
      });

      function showAlert(message, type = "error") {
        alertBox.className = `mt-4 rounded-lg p-4 ${
          type === "error"
            ? "bg-red-50 border border-red-200 text-red-700"
            : "bg-green-50 border border-green-200 text-green-700"
        }`;
        alertBox.textContent = message;
        alertBox.classList.remove("hidden");

        setTimeout(() => {
          alertBox.classList.add("hidden");
        }, 5000);
      }

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const username = document.getElementById("username").value;
        const totpCode = document.getElementById("totpCode").value;

        if (totpCode.length !== 6) {
          showAlert("Please enter a valid 6-digit TOTP code");
          return;
        }

        try {
          const formData = new FormData();
          formData.append("username", username);
          formData.append("totp_code", totpCode);

          const response = await axios.post("/api/login", formData);

          if (response.data.status === "success") {
            showAlert("Login successful! Redirecting...", "success");
            setTimeout(() => {
              window.location.href = "/";
            }, 1000);
          }
        } catch (error) {
          const message = error.response?.data?.detail || "Login failed. Please check your credentials.";
          showAlert(message);
        }
      });
    </script>
  </body>
</html>
